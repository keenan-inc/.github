name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      # setup-python's toolcache interpreter has no PyYAML preinstalled
      # (unlike the runner's system python) — install it explicitly.
      - run: pip install pyyaml
      - name: Validate labels.yml
        run: |
          python3 - <<'EOF'
          import sys
          import yaml

          with open("labels.yml") as f:
              labels = yaml.safe_load(f)

          assert isinstance(labels, list) and labels, "labels.yml must be a non-empty list"
          for entry in labels:
              assert "name" in entry, f"label entry missing 'name': {entry}"
              assert "color" in entry, f"label entry missing 'color': {entry}"

          print(f"OK: {len(labels)} labels validated")
          EOF
      - name: Validate renovate-config/*.json
        run: |
          python3 - <<'EOF'
          import glob
          import json

          files = sorted(glob.glob("renovate-config/*.json"))
          assert files, "no renovate-config/*.json files found"

          for path in files:
              with open(path) as f:
                  json.load(f)
              print(f"OK: {path}")
          EOF

  gates:
    needs: [lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check gate results
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "One or more gates failed"; exit 1
          fi
