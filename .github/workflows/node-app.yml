# Reusable CI for Node/Electron/web projects in the keenan-inc fleet.
# Call from a project repo with:
#
#   jobs:
#     ci:
#       uses: keenan-inc/.github/.github/workflows/node-app.yml@main
#
# Steps run with `--if-present`, so projects adopt gates incrementally:
# adding a `lint`/`typecheck` script to package.json turns that gate on.
#
# This must stay under .github/workflows/ — `workflow_call` reusable workflows
# are only callable via `uses:` from this exact path. It is not a starter
# template (those live in workflow-templates/ and are copied, not called).
name: node-app

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present
      - run: npm run build --if-present

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact -v
